<style>
:root{
  --bg:#f4f7f6; --card:#fff; --ink:#1d2b2a; --muted:#6b7a78; --line:#e3e9e8;
  --pri:#0f8b6f; --pri2:#e3f4ef; --warn:#d9822b; --warn2:#fdf1e4; --bad:#d64545; --bad2:#fbe9e9;
  --gold:#f2b200; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
body.simple #app,.ob{padding-top:env(safe-area-inset-top)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.35rem;margin:0;flex:1}
.top .sub{color:var(--muted);font-size:.9rem;font-weight:500}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:1.2rem;display:grid;place-items:center}
.wrap{padding:0 16px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;border:1px solid var(--line)}
.btn{background:var(--pri);color:#fff;border-radius:14px;padding:14px 18px;font-weight:600;font-size:1rem;width:100%;display:block;text-align:center}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.bad{background:var(--bad2);color:var(--bad)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.mt{margin-top:12px}.mt2{margin-top:20px}
label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:.95rem}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:1rem}
.inp:focus{outline:2px solid var(--pri);border-color:transparent}
.muted{color:var(--muted)}.small{font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.95rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:.85rem}
.tile .e{font-size:1.7rem;display:block}
.tile.on{border:2px solid var(--pri);background:var(--pri2)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;max-width:560px;width:100%}
.nav button{flex:1;background:none;padding:8px 2px 10px;font-size:.72rem;color:var(--muted)}
.nav button .e{font-size:1.35rem;display:block}
.nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));background:var(--pri);color:#fff;border-radius:18px;padding:15px 20px;font-weight:700;box-shadow:0 6px 18px rgba(15,139,111,.35);z-index:8}
/* dose cards */
.tgroup{font-weight:700;color:var(--muted);margin:18px 2px 4px;font-size:.95rem}
.dose{display:flex;gap:12px;align-items:center}
.dose .ph{width:56px;height:56px;border-radius:14px;background:var(--pri2);display:grid;place-items:center;font-size:1.8rem;flex:none;overflow:hidden}
.dose .ph img{width:100%;height:100%;object-fit:cover}
.dose .info{flex:1;min-width:0}
.dose .nm{font-weight:700;font-size:1.05rem}
.dose .meta{color:var(--muted);font-size:.88rem}
.who{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;margin-bottom:3px}
.take{background:var(--pri);color:#fff;border-radius:12px;padding:11px 12px;font-weight:700;flex:none}
.done{opacity:.6}
.done .take{background:var(--pri2);color:var(--pri)}
.miss{border-color:var(--bad);background:var(--bad2)}
.miss .take{background:var(--bad)}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.93rem}
.banner.w{background:var(--warn2);color:#8a4b0f}
.banner.b{background:var(--bad2);color:#8d2323}
.banner.g{background:var(--pri2);color:#0b5e4b}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e{font-size:3rem}
/* simple mode */
body.simple{--r:22px}
body.simple .dose .ph{width:84px;height:84px;font-size:2.6rem}
body.simple .dose{flex-wrap:wrap}
body.simple .dose .nm{font-size:1.5rem}
body.simple .dose .meta{font-size:1.1rem}
body.simple .take{width:100%;padding:20px;font-size:1.5rem;border-radius:18px;margin-top:6px}
.bigclock{font-size:2.6rem;font-weight:800;text-align:center;margin:8px 0 0}
.bigdate{text-align:center;color:var(--muted);font-size:1.1rem}
/* onboarding */
.ob{padding:calc(24px + env(safe-area-inset-top)) 18px 24px}
.ob h2{font-size:1.5rem;margin:8px 0 6px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 16px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--pri);width:22px}
.choice{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;width:100%;text-align:left}
.choice.on{border-color:var(--pri);background:var(--pri2)}
.choice .e{font-size:2rem}
.choice b{display:block;font-size:1.05rem}
.disc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 16px;max-height:52vh;overflow:auto;font-size:.95rem}
.disc li{margin:8px 0}
.check{display:flex;gap:12px;align-items:center;margin:16px 0;font-weight:600}
.check input{width:26px;height:26px;accent-color:var(--pri)}
.logo{font-size:3.5rem;text-align:center}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pinpad button{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:1.4rem;font-weight:700}
.pindots{display:flex;gap:14px;justify-content:center;margin:14px 0}
.pindots i{width:16px;height:16px;border-radius:9px;border:2px solid var(--pri)}
.pindots i.on{background:var(--pri)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1d2b2a;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;font-weight:600;max-width:90%;text-align:center}
.stars{display:flex;gap:10px}
.stars .card{flex:1;text-align:center;margin:6px 0}
.stars .n{font-size:1.6rem;font-weight:800}
.badge{display:inline-block;background:#fff4cc;color:#7a5a00;border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem}
.plist .pp{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;flex:none}
.hday summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--pri)}
.perm{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.perm:last-child{border:0}
.perm .s{flex:1}
.perm button{background:var(--pri2);color:var(--pri);border-radius:10px;padding:8px 12px;font-weight:700}
.tline{display:flex;gap:8px;margin:6px 0}
.tline .inp{flex:1}
.x{background:var(--bad2);color:var(--bad);border-radius:12px;width:48px;font-size:1.1rem}
.seg{display:flex;background:#e9efee;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:none;padding:10px 4px;border-radius:9px;font-size:.9rem}
.seg button.on{background:#fff;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.setrow:last-child{border:0}
.fire{font-size:1.1rem;font-weight:800;color:#e0621a}
</style>
</head>

/* Lotin -> Kirill (o'zbek) */
function toCyr(s){
  const map={a:"а",b:"б",d:"д",e:"е",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",x:"х",y:"й",z:"з",c:"с"};
  const isL=ch=>/[A-Za-z]/.test(ch);
  let out="",i=0;
  const up=(src,res)=> src===src.toUpperCase()&&src!==src.toLowerCase()? res.charAt(0).toUpperCase()+res.slice(1):res;
  while(i<s.length){
    const c=s[i], c2=s.substr(i,2), lc2=c2.toLowerCase(), nx=s[i+1]||"";
    if(c==="%"&&/\d/.test(nx)){out+=c+nx;i+=2;continue}
    const prev=i>0?s[i-1]:"";
    const wordStart=!isL(prev)&&prev!=="'";
    if((lc2==="o'"||lc2==="o‘"||lc2==="oʻ")){out+=up(c,"ў");i+=2;continue}
    if((lc2==="g'"||lc2==="g‘"||lc2==="gʻ")){out+=up(c,"ғ");i+=2;continue}
    if(lc2==="sh"){out+=up(c,"ш");i+=2;continue}
    if(lc2==="ch"){out+=up(c,"ч");i+=2;continue}
    if(lc2==="yo"){out+=up(c,"ё");i+=2;continue}
    if(lc2==="yu"){out+=up(c,"ю");i+=2;continue}
    if(lc2==="ya"){out+=up(c,"я");i+=2;continue}
    if(lc2==="ye"){out+=up(c,"е");i+=2;continue}
    if(lc2==="ts"&&!wordStart){out+=up(c,"ц");i+=2;continue}
    const lc=c.toLowerCase();
    if(lc==="e"&&wordStart){out+=up(c,"э");i++;continue}
    if((c==="'"||c==="’")&&isL(prev)&&isL(nx)){out+="ъ";i++;continue}
    if(map[lc]){out+=up(c,map[lc]);i++;continue}
    out+=c;i++;
  }
  return out;
}
function deepCyr(o){ if(typeof o==="string") return toCyr(o); if(Array.isArray(o)) return o.map(deepCyr); const r={}; for(const k in o) r[k]=deepCyr(o[k]); return r; }

/* Dori shu kuni ichiladimi */
function isDue(m,day){
  if(m.paused) return false;
  if(day<m.startDate) return false;
  const dd=diffDays(day,m.startDate);
  if(m.days>0 && dd>=m.days) return false;
  if(m.kind==="other" && dd%2!==0) return false;
  if(m.kind==="week"){ let w=parseD(day).getDay(); w=w===0?7:w; if(!(m.wd||[]).includes(w)) return false; }
  return true;
}
function dosesOn(day){
  const out=[];
  for(const m of D.meds){ if(!personOf(m.personId)||!isDue(m,day)) continue;
    for(const t of m.times) out.push({m,t,key:m.id+"@"+t,taken:!!(D.log[day]&&D.log[day][m.id+"@"+t])}); }
  out.sort((a,b)=>a.t.localeCompare(b.t)||a.m.name.localeCompare(b.m.name));
  return out;
}
function perDayAmount(m){ return (m.times.length||1)*(Number(m.amount)||1)*(m.kind==="other"?0.5:1); }
function daysLeft(m){ if(m.stock==null||m.stock==="") return null; return Math.floor(Number(m.stock)/perDayAmount(m)); }
function streakOf(pid){
  let n=0, day=ds();
  const todayDoses=dosesOn(day).filter(x=>x.m.personId===pid);
  if(todayDoses.length && todayDoses.every(x=>x.taken)) n=1;
  for(let i=1;i<60;i++){ const d=addDays(ds(),-i); const xs=dosesOn(d).filter(x=>x.m.personId===pid);
    if(!xs.length) { if(i>30) break; continue; }
    if(xs.every(x=>x.taken)) n++; else break; }
  return n;
}
function markTaken(day,dose,on){
  D.log[day]=D.log[day]||{};
  const m=dose.m, p=personOf(m.personId);
  if(on){
    D.log[day][dose.key]=Date.now();
    if(m.stock!=null&&m.stock!=="") m.stock=Math.max(0,Number(m.stock)-(Number(m.amount)||1));
    const g=p?ageGroup(p.year):"adult";
    if(g==="child"||g==="teen"){ D.stars[p.id]=(D.stars[p.id]||0)+1; toast(T("starPlus")); }
    save();
    if(p&&(g==="child"||g==="teen")){ const s=streakOf(p.id); if(s>=7&&D.heroes[p.id]!==ds()){ D.heroes[p.id]=ds(); save(); setTimeout(()=>toast(T("hero"),3500),900);} }
  } else {
    delete D.log[day][dose.key];
    if(m.stock!=null&&m.stock!=="") m.stock=Number(m.stock)+(Number(m.amount)||1);
    if(p&&D.stars[p.id]>0){ const g=ageGroup(p.year); if(g==="child"||g==="teen") D.stars[p.id]--; }
    save();
  }
  render();
}

function pinPad(title,onDone){
  let v="";
  const draw=()=>{
    $("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet">
      <h3 style="text-align:center;margin:6px 0">${esc(title)}</h3>

      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
      <button data-n="x">✕</button><button data-n="0">0</button><button data-n="b">⌫</button></div></div></div>`;
    $("#modal").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{
      const n=b.dataset.n;
      if(n==="x") return closeModal();
      if(n==="b") v=v.slice(0,-1); else if(v.length<4) v+=n;
      draw();
      if(v.length===4){ setTimeout(()=>{ const r=onDone(v); if(r===false){ v=""; draw(); } },120); }
    });
  };
  draw();
}

function getPhoto(camera,cb){
  const name="photo_"+uid()+".jpg";
  if(N){ pendingPhoto=cb; camera? N.takePhoto(name) : N.pickPhoto(name); return; }
  const f=$("#fpick"); f.value="";
  if(camera) f.setAttribute("capture","environment"); else f.removeAttribute("capture");
  f.onchange=()=>{ const file=f.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
      const max=480, sc=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas");
      c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const url=c.toDataURL("image/jpeg",0.75); mockFiles[name]=url; try{ localStorage.setItem("dvPhoto_"+name,url); }catch(e){} cb(name); };
      img.src=r.result; }; r.readAsDataURL(file); };
  f.click();
}

function doseCard(x,day,big){
  const m=x.m, p=personOf(m.personId), ty=typeOf(m.type), ph=photoURL(m.photo);
  const g=p?ageGroup(p.year):"adult";
  const late = day===ds() && !x.taken && nowMin()-tMin(x.t)>60;
  const care = g==="child" || (p && !p.isOwner);
  const btn = x.taken? (care?T("given"):T("taken")) : (care?T("give"):T("take"));
  return `<div class="card dose ${x.taken?"done":""} ${late?"miss":""}">
    <div class="ph">${ph?`<img src="${ph}">`:ty.e}</div>
    <div class="info">${D.persons.length>1||care?`<span class="who" style="background:${p.color}">${p.avatar} ${esc(p.name)}</span><br>`:""}
      <div class="nm">${esc(m.name)}</div>
      <div class="meta">${esc(fmtAmt(m))} · ${T("f_"+m.food)}${late?` · <b style="color:var(--bad)">${T("missed")}</b>`:""}</div></div>
    <button class="take" data-dose="${esc(x.key)}" data-day="${day}">${btn}</button></div>`;
}
function fmtAmt(m){ return (m.amount||1)+" "+T("u_"+m.unit); }
function stockBanners(){
  return D.meds.filter(m=>!m.paused&&personOf(m.personId)).map(m=>{ const dl=daysLeft(m); if(dl===null) return "";
    if(Number(m.stock)<=0) return `<div class="banner b">⚠️ ${esc(T("stockOut",m.name))}</div>`;

}

/* ---------- Oddiy rejim ---------- */
function renderSimple(){
  const day=ds(), xs=dosesOn(day);

    <div class="card small">${T("times")}: <b>${F.times.join(", ")}</b></div>`;
  } else {
    h+=`<label class="f">${T("times")} <span class="muted small">(${T("perDay",F.times.length)})</span></label>
    <div class="chips" style="margin-bottom:8px">${[[1,["08:00"]],[2,["08:00","20:00"]],[3,["08:00","14:00","20:00"]],[4,["08:00","12:00","16:00","20:00"]]].map(([n,ts])=>`<button class="chip" data-preset='${JSON.stringify(ts)}'>${n}×</button>`).join("")}</div>
    ${F.times.map((t,i)=>`<div class="tline"><input class="inp" type="time" data-ti="${i}" value="${t}">${F.times.length>1?`<button class="x" data-tx="${i}">✕</button>`:""}</div>`).join("")}
    <button class="chip" id="tAdd">${T("addTime")}</button>`;
  }
  h+=`<div class="row"><div><label class="f">${T("startDate")}</label><input class="inp" type="date" id="mStart" value="${esc(F.startDate)}"></div>
      <div><label class="f">${T("duration")}</label><input class="inp" id="mDays" inputmode="numeric" value="${esc(F.days)}" placeholder="${esc(T("forever"))}"></div></div>
      <div class="muted small" style="margin-top:4px">${T("durPh")}</div>`;
  h+=`<label class="f">${T("stock")}</label><input class="inp" id="mStock" inputmode="decimal" value="${esc(F.stock)}" placeholder="${esc(T("stockPh"))}">`;
  h+=`<label class="f">${T("photo")}</label>${ph?`<img src="${ph}" style="width:100%;max-height:220px;object-fit:cover;border-radius:16px">`:""}
     <div class="row mt"><button class="btn sec" id="phCam">${T("takePhoto")}</button><button class="btn sec" id="phGal">${T("pickPhoto")}</button></div>
     ${ph?`<button class="btn ghost mt" id="phDel">${T("removePhoto")}</button>`:""}`;
  h+=`<button class="btn mt2" id="mSave">${T("save")}</button>`;

function bindMedForm(){
  const a=$("#app");
  const re=()=>{readForm();render();};
  $("#mBack").onclick=()=>go(R.back||"meds",{care:R.care});
  a.querySelectorAll("[data-fp]").forEach(b=>b.onclick=()=>{readForm();F.personId=b.dataset.fp;render()});
  a.querySelectorAll("[data-ft]").forEach(b=>b.onclick=()=>{readForm();F.type=b.dataset.ft;F.unit=typeOf(F.type).u[0];render()});
  a.querySelectorAll("[data-fu]").forEach(b=>b.onclick=()=>{readForm();F.unit=b.dataset.fu;render()});
  a.querySelectorAll("[data-ff]").forEach(b=>b.onclick=()=>{readForm();F.food=b.dataset.ff;render()});
  a.querySelectorAll("[data-fk]").forEach(b=>b.onclick=()=>{readForm();F.kind=b.dataset.fk;if(F.kind==="int")genInterval();render()});
  a.querySelectorAll("[data-fw]").forEach(b=>b.onclick=()=>{readForm();const w=Number(b.dataset.fw);F.wd=F.wd.includes(w)?F.wd.filter(x=>x!==w):[...F.wd,w].sort();render()});
  a.querySelectorAll("[data-fe]").forEach(b=>b.onclick=()=>{readForm();F.every=Number(b.dataset.fe);genInterval();render()});
  const mf=$("#mFirst"); if(mf) mf.onchange=()=>{readForm();genInterval();render()};
  a.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{readForm();F.times=JSON.parse(b.dataset.preset);render()});
  a.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>{readForm();F.times.splice(Number(b.dataset.tx),1);render()});
  const ta=$("#tAdd"); if(ta) ta.onclick=()=>{readForm();F.times.push("12:00");render()};
  $("#phCam").onclick=()=>{readForm();getPhoto(true,n=>{F.photo=n;render()})};
  $("#phGal").onclick=()=>{readForm();getPhoto(false,n=>{F.photo=n;render()})};
  const pd=$("#phDel"); if(pd) pd.onclick=()=>{readForm();F.photo=null;render()};
  $("#mSave").onclick=()=>{
    readForm();
    F.name=F.name.trim(); if(!F.name) return toast(T("needMedName"));
    F.times=[...new Set(F.times.filter(t=>/^\d\d:\d\d$/.test(t)))].sort();
    if(!F.times.length) return toast(T("needTime"));
    if(F.kind==="week"&&!F.wd.length) return toast(T("needDays"));
    const m=Object.assign({},F);
    m.amount=Number(String(m.amount).replace(",","."))||1;
    m.days=Number(m.days)||0;
    m.stock = String(m.stock).trim()===""? null : (Number(String(m.stock).replace(",","."))||0);
    if(!m.id){ m.id=uid(); D.meds.push(m); } else { const i=D.meds.findIndex(x=>x.id===m.id); const old=D.meds[i]; if(old.calAt&&calSig(old)!==calSig(m)) m.calDirty=true; D.meds[i]=m; }
    save(); toast(T("medSaved")); go(R.back==="home"?"home":"meds",{care:R.care});
  };
  const mp=$("#mPause"); if(mp) mp.onclick=()=>{ const m=D.meds.find(x=>x.id===F.id); m.paused=!m.paused; save(); go("meds",{care:R.care}); };
  const md=$("#mDel"); if(md) md.onclick=()=>confirmBox(T("delMedQ"),()=>{ D.meds=D.meds.filter(x=>x.id!==F.id); save(); go("meds",{care:R.care}); });
}

function bindFamily(){
  const a=$("#app");
  const fa=$("#famAdd"); if(fa) fa.onclick=()=>guard(()=>personSheet(null,p=>{p.color=p.color||COLORS[D.persons.length%COLORS.length]; D.persons.push(p); save(); render();}));
  a.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>guard(()=>{ const p=personOf(b.dataset.pe);
    personSheet(p,np=>{ Object.assign(p,np); if(p.isOwner){ D.owner={name:p.name,year:p.year}; } save(); render(); });
    const sh=$("#modal .sheet"); if(sh&&!p.isOwner){ const del=document.createElement("button"); del.className="btn bad mt"; del.textContent=T("del"); del.onclick=()=>confirmBox(T("delPersonQ"),()=>{ D.meds=D.meds.filter(m=>m.personId!==p.id); D.persons=D.persons.filter(x=>x.id!==p.id); save(); render(); }); sh.appendChild(del); }
  }));
  a.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{

  });

/* ---------- Tarix ---------- */
function renderHist(){
  let h=`<div class="top"><h1>${T("history")}<div class="sub">${T("hist14")}</div></h1></div><div class="wrap">`;
  for(let i=0;i<14;i++){ const day=addDays(ds(),-i), xs=dosesOn(day).filter(x=>i>0||tMin(x.t)<=nowMin()||x.taken);
    const tk=xs.filter(x=>x.taken).length, pct=xs.length?Math.round(tk/xs.length*100):0;
    h+=`<details class="card hday"><summary><b style="min-width:120px">${i===0?T("today"):fmtDateLong(day)}</b><span class="bar"><i style="width:${pct}%;background:${pct===100?"var(--pri)":pct>=50?"var(--warn)":"var(--bad)"}"></i></span><span class="small">${xs.length?tk+"/"+xs.length:"—"}</span></summary>
      ${xs.length?xs.map(x=>{const p=personOf(x.m.personId);const tm=x.taken&&D.log[day][x.key];const at=typeof tm==="number"?new Date(tm):null;return `<div class="small" style="padding:6px 0;border-top:1px solid var(--line)">${x.taken?"✅":"❌"} <b>${x.t}</b> · ${p.avatar} ${esc(p.name)} · ${esc(x.m.name)} ${esc(fmtAmt(x.m))}${at?` <span class="muted">(${pad(at.getHours())}:${pad(at.getMinutes())})</span>`:""}</div>`}).join(""):`<div class="muted small">${T("nothing")}</div>`}</details>`; }
  return h+`</div>`;
}

/* ================= iPhone kalendari (.ics) ================= */
function isStandalone(){ return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true; }
function calSig(m){ return JSON.stringify([m.name,m.amount,m.unit,m.kind,m.times,m.wd,m.startDate,m.days,m.paused,m.personId,m.food]); }
function calBanners(){
  return D.meds.filter(m=>!m.paused&&personOf(m.personId)).map(m=>{
    if(!m.calAt) return `<div class="banner w">📅 ${esc(T("calNeed",m.name))}<br><button class="chip" data-cal="${m.id}" style="margin-top:8px">${T("calBtn")}</button></div>`;
    if(m.calDirty) return `<div class="banner w">📅 ${esc(T("calChanged",m.name))}<br><button class="chip" data-cal="${m.id}" style="margin-top:8px">${T("calBtn")}</button></div>`;
    return ""; }).join("");
}
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function exportCal(meds){
  if(!meds.length) return;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Dori vaqti//UZ","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const BY=["MO","TU","WE","TH","FR","SA","SU"];
  for(const m of meds){ const p=personOf(m.personId);
    for(const t of m.times){
      let start=m.startDate;
      if(m.kind==="week"){ for(let i=0;i<7;i++){ const d=addDays(m.startDate,i); let w=parseD(d).getDay(); w=w===0?7:w; if((m.wd||[]).includes(w)){ start=d; break; } } }
      const dt=start.replace(/-/g,"")+"T"+t.replace(":","")+"00";
      let rr = m.kind==="other"? "FREQ=DAILY;INTERVAL=2" : m.kind==="week"? "FREQ=WEEKLY;BYDAY="+(m.wd||[]).map(w=>BY[w-1]).join(",") : "FREQ=DAILY";
      if(m.days>0) rr+=";UNTIL="+addDays(m.startDate,m.days-1).replace(/-/g,"")+"T235959";
      const title="💊 "+(p&&D.persons.length>1?p.name+": ":"")+m.name+" — "+fmtAmt(m);
      const food=m.food!=="any"?T("f_"+m.food):"";
      L.push("BEGIN:VEVENT","UID:dv-"+m.id+"-"+t.replace(":","")+"@dorivaqti","DTSTAMP:"+stamp,"DTSTART:"+dt,"DURATION:PT10M","RRULE:"+rr,
        "SUMMARY:"+icsEsc(title),"DESCRIPTION:"+icsEsc(T("calEvent")+(food?" · "+food:"")),
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"TRIGGER:PT0M","END:VALARM",
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"TRIGGER:PT10M","END:VALARM","END:VEVENT");
    } }
  L.push("END:VCALENDAR");
  const text=L.join("\r\n");
  const blob=new Blob([text],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="dori-vaqti.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  meds.forEach(m=>{ const x=D.meds.find(y=>y.id===m.id); if(x){ x.calAt=Date.now(); x.calDirty=false; } });
  save(); toast(T("calDone"),3500); render();
}
if(!N && "serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

window.handleBack=function(){
  if($("#modal").innerHTML){ closeModal(); return true; }
  if(!D.setupDone){ if(R.step>0){ R.step--; render(); return true; } return false; }
  if(R.scr==="med"){ go(R.back||"meds",{care:R.care}); return true; }
  if(R.scr==="disc"){ go("set",{care:R.care}); return true; }
  if(R.scr!=="home"){ go("home",{care:R.care}); return true; }
  if(R.care&&uiMode()==="simple"){ unlockedUntil=0; R={scr:"home"}; render(); return true; }
  return false;
};
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ D=load(); if(D.setupDone) render(); } });
setInterval(()=>{ if(D.setupDone&&R.scr==="home"&&!$("#modal").innerHTML) render(); }, 60000);
render();
