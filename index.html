<style>
:root{
  --bg:#f4f7f6; --card:#fff; --ink:#1d2b2a; --muted:#6b7a78; --line:#e3e9e8;
  --pri:#0f8b6f; --pri2:#e3f4ef; --warn:#d9822b; --warn2:#fdf1e4; --bad:#d64545; --bad2:#fbe9e9;
  --gold:#f2b200; --r:16px; --seg:#e9efee; --ok:#0f8b6f;
}
html[data-theme=dark]{
  --bg:#0f1715; --card:#17221f; --ink:#e4eeeb; --muted:#94a6a2; --line:#27352f;
  --pri:#2fbf98; --pri2:#163a30; --warn:#e8a04a; --warn2:#3a2b17; --bad:#ef6b6b; --bad2:#3b1d1d; --seg:#21302b; --ok:#2fbf98;
  color-scheme:dark;
}
html[data-theme=dark] .banner.w{color:#f5c98a} html[data-theme=dark] .banner.b{color:#f5a3a3} html[data-theme=dark] .banner.g{color:#9fe3cf}
html[data-theme=dark] .toast{background:#e4eeeb;color:#0f1715}
html[data-theme=dark] .badge{background:#3a3214;color:#f2d47a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
button{font:inherit;cursor:pointer;border:0}
input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
body.simple #app,.ob{padding-top:env(safe-area-inset-top)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.top h1{font-size:1.35rem;margin:0;flex:1}
.top .sub{color:var(--muted);font-size:.9rem;font-weight:500}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:1.2rem;display:grid;place-items:center}
.wrap{padding:0 16px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:10px 0;border:1px solid var(--line)}
.btn{background:var(--pri);color:#fff;border-radius:14px;padding:14px 18px;font-weight:600;font-size:1rem;width:100%;display:block;text-align:center}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.bad{background:var(--bad2);color:var(--bad)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.mt{margin-top:12px}.mt2{margin-top:20px}
label.f{display:block;font-weight:600;margin:14px 0 6px;font-size:.95rem}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1rem}
.inp:focus{outline:2px solid var(--pri);border-color:transparent}
.muted{color:var(--muted)}.small{font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:.95rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;font-size:.85rem}
.tile .e{font-size:1.7rem;display:block}
.tile.on{border:2px solid var(--pri);background:var(--pri2)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:9;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;max-width:560px;width:100%}
.nav button{flex:1;background:none;padding:8px 2px 10px;font-size:.72rem;color:var(--muted)}
.nav button .e{font-size:1.35rem;display:block}
.nav button.on{color:var(--pri);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(84px + env(safe-area-inset-bottom));background:var(--pri);color:#fff;border-radius:18px;padding:15px 20px;font-weight:700;box-shadow:0 6px 18px rgba(15,139,111,.35);z-index:8}
/* dose cards */
.tgroup{font-weight:700;color:var(--muted);margin:18px 2px 4px;font-size:.95rem}
.dose{display:flex;gap:12px;align-items:center}
.dose .ph{width:56px;height:56px;border-radius:14px;background:var(--pri2);display:grid;place-items:center;font-size:1.8rem;flex:none;overflow:hidden}
.dose .ph img{width:100%;height:100%;object-fit:cover}
.dose .info{flex:1;min-width:0}
.dose .nm{font-weight:700;font-size:1.05rem}
.dose .meta{color:var(--muted);font-size:.88rem}
.who{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;margin-bottom:3px}
.take{background:var(--pri);color:#fff;border-radius:12px;padding:11px 12px;font-weight:700;flex:none}
.done{opacity:.6}
.done .take{background:var(--pri2);color:var(--pri)}
.miss{border-color:var(--bad);background:var(--bad2)}
.miss .take{background:var(--bad)}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.93rem}
.banner.w{background:var(--warn2);color:#8a4b0f}
.banner.b{background:var(--bad2);color:#8d2323}
.banner.g{background:var(--pri2);color:#0b5e4b}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .e{font-size:3rem}
/* simple mode */
body.simple{--r:22px}
body.simple .dose .ph{width:84px;height:84px;font-size:2.6rem}
body.simple .dose{flex-wrap:wrap}
body.simple .dose .nm{font-size:1.5rem}
body.simple .dose .meta{font-size:1.1rem}
body.simple .take{width:100%;padding:20px;font-size:1.5rem;border-radius:18px;margin-top:6px}
.bigclock{font-size:2.6rem;font-weight:800;text-align:center;margin:8px 0 0}
.bigdate{text-align:center;color:var(--muted);font-size:1.1rem}
/* onboarding */
.ob{padding:calc(24px + env(safe-area-inset-top)) 18px 24px}
.ob h2{font-size:1.5rem;margin:8px 0 6px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 16px}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--pri);width:22px}
.choice{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;width:100%;text-align:left}
.choice.on{border-color:var(--pri);background:var(--pri2)}
.choice .e{font-size:2rem}
.choice b{display:block;font-size:1.05rem}
.disc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px;max-height:52vh;overflow:auto;font-size:.95rem}
.disc li{margin:8px 0}
.check{display:flex;gap:12px;align-items:center;margin:16px 0;font-weight:600}
.check input{width:26px;height:26px;accent-color:var(--pri)}
.logo{font-size:3.5rem;text-align:center}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pinpad button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:1.4rem;font-weight:700}
.pindots{display:flex;gap:14px;justify-content:center;margin:14px 0}
.pindots i{width:16px;height:16px;border-radius:9px;border:2px solid var(--pri)}
.pindots i.on{background:var(--pri)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1d2b2a;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;font-weight:600;max-width:90%;text-align:center}
.stars{display:flex;gap:10px}
.stars .card{flex:1;text-align:center;margin:6px 0}
.stars .n{font-size:1.6rem;font-weight:800}
.badge{display:inline-block;background:#fff4cc;color:#7a5a00;border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem}
.plist .pp{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;flex:none}
.hday summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--pri)}
.perm{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.perm:last-child{border:0}
.perm .s{flex:1}
.perm button{background:var(--pri2);color:var(--pri);border-radius:10px;padding:8px 12px;font-weight:700}
.tline{display:flex;gap:8px;margin:6px 0}
.tline .inp{flex:1}
.x{background:var(--bad2);color:var(--bad);border-radius:12px;width:48px;font-size:1.1rem}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;background:none;padding:10px 4px;border-radius:9px;font-size:.9rem}
.seg button.on{background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;text-align:left}
.setrow:last-child{border:0}
.fire{font-size:1.1rem;font-weight:800;color:#e0621a}
/* v1.2 */
body{transition:background .3s}
.prog{display:flex;gap:14px;align-items:center}
.ring{position:relative;width:78px;height:78px;flex:none}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.05rem}
.ring.big{width:120px;height:120px}.ring.big b{font-size:1.6rem}
.next{margin-top:6px;font-size:.95rem}
.next b{color:var(--pri)}
.skipbtn{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 10px;font-weight:600;font-size:.82rem;margin-top:6px}
.skipped{opacity:.65}
.reason{display:inline-block;font-size:.8rem;background:var(--seg);border-radius:8px;padding:2px 8px;margin-top:3px}
.rrow{display:grid;grid-template-columns:minmax(0,8.5em) minmax(0,1fr) 3.2em;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rrow .bar{height:10px}
.pct{text-align:right;font-weight:700}
.chart{width:100%;height:auto;display:block}
.kp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kp div{background:var(--bg);border-radius:12px;padding:8px;text-align:center}
.kp b{display:block;font-size:1.25rem}
.kp span{font-size:.75rem;color:var(--muted)}
.doctxt{width:100%;min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:.82rem;line-height:1.45;white-space:pre-wrap;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px}
.pop{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:70}
.pop i{width:120px;height:120px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:4rem;font-style:normal;animation:popin .75s ease-out forwards;box-shadow:0 10px 30px rgba(0,0,0,.25)}
@keyframes popin{0%{transform:scale(.2);opacity:0}35%{transform:scale(1.08);opacity:1}70%{transform:scale(1)}100%{transform:scale(1);opacity:0}}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:69;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;color:var(--ink)}
.tool .e{font-size:1.6rem;display:block}.tool b{display:block;font-size:.88rem;margin-top:2px}.tool span{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.tap{cursor:pointer}
.box{display:grid;grid-template-columns:4.6em repeat(7,minmax(0,1fr));gap:3px;margin-top:12px;font-size:.72rem}
.bh{text-align:center;font-weight:700;color:var(--muted);padding:4px 0}.bh span{font-size:.95rem;color:var(--ink)}
.bh.today{color:var(--pri)}
.bp{font-weight:700;color:var(--muted);display:flex;align-items:center;font-size:.66rem;overflow-wrap:anywhere}
.bc{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:54px;padding:3px;display:flex;flex-direction:column;gap:3px}
.bc.today{border-color:var(--pri)}
.pill{background:var(--pri2);border-radius:6px;padding:2px;text-align:center;line-height:1.1;font-size:.95rem}
.pill span{display:block;font-size:.58rem;color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill i{display:block;font-size:.55rem;color:var(--muted);font-style:normal}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.vt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;color:var(--ink)}
.vt.on{border:2px solid var(--pri);background:var(--pri2)}
.vt span{display:block;font-size:.82rem;color:var(--muted)}.vt b{display:block;font-size:1.3rem}.vt i{display:block;font-size:.72rem;color:var(--muted);font-style:normal}
.dbox{flex:none;width:54px;height:58px;border-radius:12px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;text-align:center;line-height:1}
.dbox b{font-size:1.4rem}.dbox span{font-size:.72rem}
@media (prefers-reduced-motion:reduce){.pop i,.cf{animation:none;display:none}}
</style>

/* Lotin -> Kirill (o'zbek) */
function toCyr(s){
  const map={a:"а",b:"б",d:"д",e:"е",f:"ф",g:"г",h:"ҳ",i:"и",j:"ж",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"қ",r:"р",s:"с",t:"т",u:"у",v:"в",x:"х",y:"й",z:"з",c:"с"};
  const isL=ch=>/[A-Za-z]/.test(ch);
  let out="",i=0;
  const up=(src,res)=> src===src.toUpperCase()&&src!==src.toLowerCase()? res.charAt(0).toUpperCase()+res.slice(1):res;
  while(i<s.length){
    const c=s[i], c2=s.substr(i,2), lc2=c2.toLowerCase(), nx=s[i+1]||"";
    if(c==="%"&&/\d/.test(nx)){out+=c+nx;i+=2;continue}
    const prev=i>0?s[i-1]:"";
    const wordStart=!isL(prev)&&prev!=="'";
    if((lc2==="o'"||lc2==="o‘"||lc2==="oʻ")){out+=up(c,"ў");i+=2;continue}
    if((lc2==="g'"||lc2==="g‘"||lc2==="gʻ")){out+=up(c,"ғ");i+=2;continue}
    if(lc2==="sh"){out+=up(c,"ш");i+=2;continue}
    if(lc2==="ch"){out+=up(c,"ч");i+=2;continue}
    if(lc2==="yo"){out+=up(c,"ё");i+=2;continue}
    if(lc2==="yu"){out+=up(c,"ю");i+=2;continue}
    if(lc2==="ya"){out+=up(c,"я");i+=2;continue}
    if(lc2==="ye"){out+=up(c,"е");i+=2;continue}
    if(lc2==="ts"&&!wordStart){out+=up(c,"ц");i+=2;continue}
    const lc=c.toLowerCase();
    if(lc==="e"&&wordStart){out+=up(c,"э");i++;continue}
    if((c==="'"||c==="’")&&isL(prev)&&isL(nx)){out+="ъ";i++;continue}
    if(map[lc]){out+=up(c,map[lc]);i++;continue}
    out+=c;i++;
  }
  return out;
}
function deepCyr(o){ if(typeof o==="string") return toCyr(o); if(Array.isArray(o)) return o.map(deepCyr); const r={}; for(const k in o) r[k]=deepCyr(o[k]); return r; }

function isDue(m,day){
  if(m.paused) return false;
  if(day<m.startDate) return false;
  const dd=diffDays(day,m.startDate);
  if(m.days>0 && dd>=m.days) return false;
  if(m.kind==="other" && dd%2!==0) return false;
  if(m.kind==="week"){ let w=parseD(day).getDay(); w=w===0?7:w; if(!(m.wd||[]).includes(w)) return false; }
  return true;
}
function dosesOn(day){
  const out=[];
  for(const m of D.meds){ if(!personOf(m.personId)||!isDue(m,day)) continue;
    for(const t of m.times) out.push({m,t,key:m.id+"@"+t,taken:!!(D.log[day]&&D.log[day][m.id+"@"+t])}); }
  out.sort((a,b)=>a.t.localeCompare(b.t)||a.m.name.localeCompare(b.m.name));
  return out;
}
function perDayAmount(m){ return (m.times.length||1)*(Number(m.amount)||1)*(m.kind==="other"?0.5:1); }
function daysLeft(m){ if(m.stock==null||m.stock==="") return null; return Math.floor(Number(m.stock)/perDayAmount(m)); }
function streakOf(pid){
  let n=0, day=ds();
  const todayDoses=dosesOn(day).filter(x=>x.m.personId===pid);
  if(todayDoses.length && todayDoses.every(x=>x.taken)) n=1;
  for(let i=1;i<60;i++){ const d=addDays(ds(),-i); const xs=dosesOn(d).filter(x=>x.m.personId===pid);
    if(!xs.length) { if(i>30) break; continue; }
    if(xs.every(x=>x.taken)) n++; else break; }
  return n;
}
function markTaken(day,dose,on){
  D.log[day]=D.log[day]||{};
  const m=dose.m, p=personOf(m.personId);
  if(on){
    D.log[day][dose.key]=Date.now();
    if(D.skip&&D.skip[day]) delete D.skip[day][dose.key];
    if(m.stock!=null&&m.stock!=="") m.stock=Math.max(0,Number(m.stock)-(Number(m.amount)||1));
    const g=p?ageGroup(p.year):"adult";
    celebrate(g==="child"||g==="teen");
    if(g==="child"||g==="teen"){ D.stars[p.id]=(D.stars[p.id]||0)+1; toast(T("starPlus")); }
    save();
    if(p&&(g==="child"||g==="teen")){ const s=streakOf(p.id); if(s>=7&&D.heroes[p.id]!==ds()){ D.heroes[p.id]=ds(); save(); setTimeout(()=>toast(T("hero"),3500),900);} }
  } else {
    delete D.log[day][dose.key];
    if(m.stock!=null&&m.stock!=="") m.stock=Number(m.stock)+(Number(m.amount)||1);
    if(p&&D.stars[p.id]>0){ const g=ageGroup(p.year); if(g==="child"||g==="teen") D.stars[p.id]--; }
    save();
  }
  render();
}

function doseCard(x,day,big){
  const m=x.m, p=personOf(m.personId), ty=typeOf(m.type), ph=photoURL(m.photo);
  const g=p?ageGroup(p.year):"adult";
  const reason = D.skip&&D.skip[day]&&D.skip[day][x.key];
  const late = day===ds() && !x.taken && !reason && nowMin()-tMin(x.t)>60;
  const care = g==="child" || (p && !p.isOwner);
  const btn = x.taken? (care?T("given"):T("taken")) : (care?T("give"):T("take"));
  return `<div class="card dose ${x.taken?"done":""} ${late?"miss":""} ${reason?"skipped":""}">
    <div class="ph">${ph?`<img src="${ph}">`:ty.e}</div>
    <div class="info">${D.persons.length>1||care?`<span class="who" style="background:${p.color}">${p.avatar} ${esc(p.name)}</span><br>`:""}
      <div class="nm">${esc(m.name)}</div>
      <div class="meta">${esc(fmtAmt(m))} · ${T("f_"+m.food)}${late?` · <b style="color:var(--bad)">${T("missed")}</b>`:""}</div>
      ${reason?`<span class="reason">⏭ ${T("skippedL")}: ${esc(T("r_"+reason))}</span>`:""}
      ${late&&!big?`<br><button class="skipbtn" data-skip="${esc(x.key)}" data-day="${day}">✋ ${T("notTaken")}</button>`:""}</div>
    <button class="take" data-dose="${esc(x.key)}" data-day="${day}">${btn}</button></div>`;
}
function fmtAmt(m){ return (m.amount||1)+" "+T("u_"+m.unit); }
function stockBanners(){
  return D.meds.filter(m=>!m.paused&&personOf(m.personId)).map(m=>{ const dl=daysLeft(m); if(dl===null) return "";
    if(Number(m.stock)<=0) return `<div class="banner b">⚠️ ${esc(T("stockOut",m.name))}</div>`;
    if(dl<=3) return `<div class="banner w">🛒 ${esc(T("stockLow",m.name,dl))}</div>`; return ""; }).join("");
}

function renderSimple(){
  const day=ds(), xs=dosesOn(day);
  const d=new Date();

/* ================= iPhone kalendari (.ics) ================= */
function isStandalone(){ return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true; }
function calSig(m){ return JSON.stringify([m.name,m.amount,m.unit,m.kind,m.times,m.wd,m.startDate,m.days,m.paused,m.personId,m.food]); }
function calBanners(){
  return D.meds.filter(m=>!m.paused&&personOf(m.personId)).map(m=>{
    if(!m.calAt) return `<div class="banner w">📅 ${esc(T("calNeed",m.name))}<br><button class="chip" data-cal="${m.id}" style="margin-top:8px">${T("calBtn")}</button></div>`;
    if(m.calDirty) return `<div class="banner w">📅 ${esc(T("calChanged",m.name))}<br><button class="chip" data-cal="${m.id}" style="margin-top:8px">${T("calBtn")}</button></div>`;
    return ""; }).join("");
}
function icsEsc(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
function exportCal(meds){
  if(!meds.length) return;
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Dori vaqti//UZ","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const BY=["MO","TU","WE","TH","FR","SA","SU"];
  for(const m of meds){ const p=personOf(m.personId);
    for(const t of m.times){
      let start=m.startDate;
      if(m.kind==="week"){ for(let i=0;i<7;i++){ const d=addDays(m.startDate,i); let w=parseD(d).getDay(); w=w===0?7:w; if((m.wd||[]).includes(w)){ start=d; break; } } }
      const dt=start.replace(/-/g,"")+"T"+t.replace(":","")+"00";
      let rr = m.kind==="other"? "FREQ=DAILY;INTERVAL=2" : m.kind==="week"? "FREQ=WEEKLY;BYDAY="+(m.wd||[]).map(w=>BY[w-1]).join(",") : "FREQ=DAILY";
      if(m.days>0) rr+=";UNTIL="+addDays(m.startDate,m.days-1).replace(/-/g,"")+"T235959";
      const title="💊 "+(p&&D.persons.length>1?p.name+": ":"")+m.name+" — "+fmtAmt(m);
      const food=m.food!=="any"?T("f_"+m.food):"";
      L.push("BEGIN:VEVENT","UID:dv-"+m.id+"-"+t.replace(":","")+"@dorivaqti","DTSTAMP:"+stamp,"DTSTART:"+dt,"DURATION:PT10M","RRULE:"+rr,
        "SUMMARY:"+icsEsc(title),"DESCRIPTION:"+icsEsc(T("calEvent")+(food?" · "+food:"")),
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"TRIGGER:PT0M","END:VALARM",
        "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"TRIGGER:PT10M","END:VALARM","END:VEVENT");
    } }
  L.push("END:VCALENDAR");
  const text=L.join("\r\n");
  const blob=new Blob([text],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="dori-vaqti.ics"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);

function repDoses(nDays,pf){
  const out=[]; const today=ds(), nm=nowMin();
  for(let i=nDays-1;i>=0;i--){ const day=addDays(today,-i);
    for(const x of dosesOn(day)){ if(pf&&x.m.personId!==pf) continue;
      if(i===0&&!x.taken&&tMin(x.t)>nm) continue; // hali vaqti kelmagan
      const reason=D.skip&&D.skip[day]&&D.skip[day][x.key];
      out.push(Object.assign({day,reason},x)); } }
  return out;
}
const pctOf=(a,b)=>b?Math.round(a/b*100):0;
const pctColor=p=>p>=90?"var(--ok)":p>=70?"var(--warn)":"var(--bad)";
function repChart(nDays,pf){
  const days=[]; for(let i=nDays-1;i>=0;i--) days.push(addDays(ds(),-i));
  const all=repDoses(nDays,pf);
  const data=days.map(d=>{const xs=all.filter(x=>x.day===d);return [xs.filter(x=>x.taken).length, xs.filter(x=>!x.taken).length]});
  const max=Math.max(1,...data.map(v=>v[0]+v[1]));
  const W=600,H=170,pb=22,gap=W/nDays,bw=Math.max(4,gap*.66);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  data.forEach((v,i)=>{ const x=i*gap+(gap-bw)/2; let y=H-pb;
    const h1=v[0]/max*(H-pb-6), h2=v[1]/max*(H-pb-6);
    if(!v[0]&&!v[1]) s+=`<rect x="${x}" y="${H-pb-2}" width="${bw}" height="2" fill="var(--line)"/>`;
    if(v[0]){ y-=h1; s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h1}" rx="2" fill="var(--ok)"/>`; }
    if(v[1]){ y-=h2; s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h2}" rx="2" fill="var(--bad)"/>`; }
    const step=nDays>7?5:1;
    if((nDays-1-i)%step===0){ const d=parseD(days[i]); s+=`<text x="${x+bw/2}" y="${H-6}" font-size="${nDays>7?12:13}" text-anchor="middle" fill="var(--muted)">${d.getDate()}.${pad(d.getMonth()+1)}</text>`; } });
  return s+`</svg><div class="small muted" style="display:flex;gap:14px;margin-top:6px"><span><b style="color:var(--ok)">■</b> ${T("takenN")}</span><span><b style="color:var(--bad)">■</b> ${T("missedN")}</span></div>`;
}

const CYR2LAT={"а":"a","б":"b","в":"v","г":"g","ғ":"g'","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","қ":"q","л":"l","м":"m","н":"n","о":"o","ў":"o'","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ҳ":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya"};

function normName(s){
  s=String(s).toLowerCase();
  let o=""; for(const ch of s) o+= (ch in CYR2LAT)? CYR2LAT[ch] : ch;
  return o.replace(/[ʻʼ'‘’`\-\s.]/g,"").replace(/kh/g,"x").replace(/h/g,"x").replace(/c(?!h)/g,"s").replace(/ph/g,"f");

  const off=R.wk||0, pf=R.pf||(D.persons[0]||{}).id;
  const today=parseD(ds()); const mon=new Date(today); mon.setDate(mon.getDate()-((today.getDay()+6)%7)+7*off);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return ds(d)});
  let h=subTop("🗓 "+T("weekBox"))+`<div class="wrap">`;
  h+=`<div class="seg">${[0,1].map(o=>`<button class="${off===o?"on":""}" data-wk="${o}">${o?T("nextWeek"):T("thisWeek")}</button>`).join("")}</div>`;
  if(D.persons.length>1) h+=`<div class="chips mt">${D.persons.map(p=>`<button class="chip ${pf===p.id?"on":""}" data-wpf="${p.id}">${p.avatar} ${esc(p.name)}</button>`).join("")}</div>`;
  const need={};
  const cell=(day,part)=>{ const xs=dosesOn(day).filter(x=>x.m.personId===pf&&partOf(x.t)===part);
    xs.forEach(x=>{ const k=x.m.id; (need[k]=need[k]||{m:x.m,n:0}).n+=Number(x.m.amount)||1; });
    return xs.map(x=>`<div class="pill" title="${esc(x.m.name)} ${x.t}">${typeOf(x.m.type).e}<span>${esc(x.m.name.slice(0,9))}</span><i>${x.t}</i></div>`).join(""); };
  h+=`<div class="box"><div class="bh"></div>${days.map(d=>{const dd=parseD(d);return `<div class="bh ${d===ds()?"today":""}">${LANGS[D.lang].wd[(dd.getDay()+6)%7]}<br><span>${dd.getDate()}</span></div>`}).join("")}`;
  for(const part of ["m","d","e","n"]){ h+=`<div class="bp">${T("part_"+part)}</div>`+days.map(d=>`<div class="bc ${d===ds()?"today":""}">${cell(d,part)}</div>`).join(""); }
  h+=`</div>`;
  const nl=Object.values(need);
  h+=`<div class="card mt"><b>📦 ${T("weekNeed")}</b>${nl.length?nl.map(o=>`<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>${typeOf(o.m.type).e} ${esc(o.m.name)}</span><b style="flex:none">${Math.round(o.n*100)/100} ${esc(T("u_"+o.m.unit))}</b></div>`).join(""):`<p class="muted">${T("nothing")}</p>`}</div>`;
  return h+`</div>`;
}

/* ================= Sog'liq daftari ================= */
const VT=["bp","sugar","temp","pulse","weight"];
const vEmoji={bp:"🩸",sugar:"🍬",temp:"🌡️",pulse:"💓",weight:"⚖️"};
function vitalStr(v){ return v.type==="bp"? v.v1+"/"+v.v2 : String(v.v1); }
function renderHealth(){
  D.vitals=D.vitals||[];
  const pf=R.pf||(D.persons[0]||{}).id, vt=R.vt||"bp";
  let h=subTop("❤️ "+T("health"))+`<div class="wrap">`;
  if(D.persons.length>1) h+=`<div class="chips">${D.persons.map(p=>`<button class="chip ${pf===p.id?"on":""}" data-hpf="${p.id}">${p.avatar} ${esc(p.name)}</button>`).join("")}</div>`;
  h+=`<div class="vgrid mt">${VT.map(t=>{ const last=D.vitals.filter(v=>v.personId===pf&&v.type===t).sort((a,b)=>b.at.localeCompare(a.at))[0];
    return `<button class="vt ${vt===t?"on":""}" data-vt="${t}"><span>${vEmoji[t]} ${T("v_"+t)}</span><b>${last?esc(vitalStr(last)):"—"}</b><i>${last?esc(T("vu_"+t))+" · "+fmtDate(last.at.slice(0,10)):""}</i></button>`; }).join("")}</div>`;
  const list=D.vitals.filter(v=>v.personId===pf&&v.type===vt).sort((a,b)=>a.at.localeCompare(b.at));
  h+=`<button class="btn mt" id="vAdd">${T("addVital")}</button>`;
  h+=`<div class="card"><b>${vEmoji[vt]} ${T("v_"+vt)}</b> <span class="muted small">${T("vu_"+vt)}</span>${list.length>1?`<div class="mt">${vitalChart(list.slice(-30),vt)}</div>`:""}
    ${list.length?list.slice().reverse().slice(0,30).map(v=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b style="font-size:1.1rem">${esc(vitalStr(v))}</b> <span class="muted small">${esc(T("vu_"+vt))}</span>${v.note?`<div class="muted small">${esc(v.note)}</div>`:""}</div><span class="muted small" style="flex:none">${fmtDate(v.at.slice(0,10))}, ${v.at.slice(11,16)}</span><button class="chip" style="flex:none" data-vdel="${v.id}">✕</button></div>`).join(""):`<p class="muted">${T("noVitals")}</p>`}</div>
    <p class="muted small">ℹ️ ${T("vitalsHint")}</p>`;
  return h+`</div>`;
}
function vitalChart(list,vt){
  const W=600,H=170,pl=36,pb=22;
  const vals=list.flatMap(v=>vt==="bp"?[+v.v1,+v.v2]:[+v.v1]);
  let mn=Math.min(...vals), mx=Math.max(...vals); if(mn===mx){mn-=1;mx+=1} const padv=(mx-mn)*.15; mn-=padv; mx+=padv;
  const X=i=>pl+(W-pl-10)*(list.length===1?0.5:i/(list.length-1)), Y=v=>H-pb-(v-mn)/(mx-mn)*(H-pb-8);
  const line=(k,col)=>`<polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" points="${list.map((v,i)=>X(i)+","+Y(+v[k])).join(" ")}"/>`+list.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(+v[k])}" r="4" fill="${col}"/>`).join("");
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  [mx,(mx+mn)/2,mn].forEach(t=>{const y=Y(t); s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" font-size="12" text-anchor="end" fill="var(--muted)">${Math.round(t*10)/10}</text>`});
  s+=line("v1","var(--pri)"); if(vt==="bp") s+=line("v2","var(--warn)");
  [0,list.length-1].forEach(i=>{ if(list[i]) s+=`<text x="${X(i)}" y="${H-5}" font-size="12" text-anchor="${i?"end":"start"}" fill="var(--muted)">${fmtDate(list[i].at.slice(0,10))}</text>`; });
  return s+`</svg>`+(vt==="bp"?`<div class="small muted" style="display:flex;gap:14px"><span><b style="color:var(--pri)">●</b> ${T("sys")}</span><span><b style="color:var(--warn)">●</b> ${T("dia")}</span></div>`:"");
}
function vitalSheet(){
  const vt=R.vt||"bp", pf=R.pf||(D.persons[0]||{}).id;
  const now=new Date(), dv=ds(now), tv=pad(now.getHours())+":"+pad(now.getMinutes());
  $("#modal").innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3 style="margin:4px 0">${vEmoji[vt]} ${T("v_"+vt)}</h3>
    ${vt==="bp"?`<div class="row"><div><label class="f">${T("sys")}</label><input class="inp" id="v1" inputmode="numeric" placeholder="120"></div><div><label class="f">${T("dia")}</label><input class="inp" id="v2" inputmode="numeric" placeholder="80"></div></div>`
      :`<label class="f">${T("value")} (${T("vu_"+vt)})</label><input class="inp" id="v1" inputmode="decimal">`}
    <div class="row"><div><label class="f">${T("date")}</label><input class="inp" type="date" id="vd" value="${dv}"></div><div><label class="f">${T("time")}</label><input class="inp" type="time" id="vtm" value="${tv}"></div></div>
    <label class="f">${T("note")}</label><input class="inp" id="vn" placeholder="${esc(T("notePh"))}">
    <div class="row mt2"><button class="btn ghost" id="vC">${T("cancel")}</button><button class="btn" id="vS">${T("save")}</button></div></div></div>`;
  $("#vC").onclick=closeModal;
  $("#vS").onclick=()=>{ const num=id=>{const e=$("#"+id);return e?Number(String(e.value).replace(",",".")):NaN};
    const v1=num("v1"), v2=vt==="bp"?num("v2"):null;
    if(!(v1>0)||(vt==="bp"&&!(v2>0))) return toast(T("needVal"));
    D.vitals=D.vitals||[]; D.vitals.push({id:uid(),personId:pf,type:vt,v1,v2,at:($("#vd").value||dv)+"T"+($("#vtm").value||tv),note:$("#vn").value.trim()});
    save(); closeModal(); render(); };
}

/* ================= Shifokor qabullari ================= */
function upcomingAppts(){ const t=ds(); return (D.appts||[]).filter(a=>a.date>=t&&personOf(a.personId)).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||""))); }
function renderAppts(){
  const up=upcomingAppts(), past=(D.appts||[]).filter(a=>a.date<ds()).sort((a,b)=>b.date.localeCompare(a.date));
  let h=subTop("🩺 "+T("appts"))+`<div class="wrap"><button class="btn" id="aAdd">${T("addAppt")}</button>`;
  const card=a=>{ const p=personOf(a.personId); const d=parseD(a.date);
    return `<div class="card row tap" data-appt="${a.id}" style="cursor:pointer"><div class="dbox"><b>${d.getDate()}</b><span>${LANGS[D.lang].months[d.getMonth()].slice(0,3)}</span></div>
      <div style="flex:1"><b>${a.kind==="test"?"🧪":"👨‍⚕️"} ${esc(a.title)}</b><div class="muted small">${a.time?"⏰ "+a.time:""}${a.place?" · 📍 "+esc(a.place):""}</div>
      ${p&&D.persons.length>1?`<div class="small">${p.avatar} ${esc(p.name)}</div>`:""}${a.remind&&N?`<div class="small" style="color:var(--pri)">🔔</div>`:""}</div>
      ${!N&&a.date>=ds()?`<button class="chip" style="flex:none" data-acal="${a.id}">📅</button>`:""}</div>`; };
  h+=`<div class="tgroup">${T("upcoming")}</div>${up.length?up.map(card).join(""):`<p class="muted">${T("noAppts")}</p>`}`;
  if(past.length) h+=`<div class="tgroup">${T("past")}</div><div style="opacity:.65">${past.slice(0,20).map(card).join("")}</div>`;
  return h+`</div>`;
}
function apptSheet(id){
  const a0=(D.appts||[]).find(a=>a.id===id);
  const a=Object.assign({kind:"doctor",title:"",place:"",date:addDays(ds(),1),time:"09:00",personId:(D.persons[0]||{}).id,remind:true,note:""},a0||{});
  const draw=()=>{ $("#modal").innerHTML=`<div class="modal"><div class="sheet"><h3 style="margin:4px 0">🩺 ${T("apptT")}</h3>
    ${D.persons.length>1?`<label class="f">${T("forWho")}</label><div class="chips">${D.persons.map(p=>`<button class="chip ${a.personId===p.id?"on":""}" data-ap="${p.id}">${p.avatar} ${esc(p.name)}</button>`).join("")}</div>`:""}
    <div class="seg mt">${["doctor","test"].map(k=>`<button class="${a.kind===k?"on":""}" data-ak="${k}">${k==="test"?"🧪":"👨‍⚕️"} ${T("a_"+k)}</button>`).join("")}</div>
    <label class="f">${T("apptTitle")}</label><input class="inp" id="aT" value="${esc(a.title)}" placeholder="${esc(T("apptTitlePh"))}">
    <div class="row"><div><label class="f">${T("date")}</label><input class="inp" type="date" id="aD" value="${esc(a.date)}"></div><div><label class="f">${T("time")}</label><input class="inp" type="time" id="aTm" value="${esc(a.time)}"></div></div>
    <label class="f">${T("place")}</label><input class="inp" id="aP" value="${esc(a.place)}" placeholder="${esc(T("placePh"))}">
    ${N?`<label class="check"><input type="checkbox" id="aR" ${a.remind?"checked":""}> ${T("remindA")}</label>`:""}
    <div class="row mt2"><button class="btn ghost" id="aC">${T("cancel")}</button><button class="btn" id="aS">${T("save")}</button></div>
    ${a0?`<button class="btn bad mt" id="aX">${T("del")}</button>`:""}</div></div>`;
    const keep=()=>{a.title=$("#aT").value;a.date=$("#aD").value;a.time=$("#aTm").value;a.place=$("#aP").value;const r=$("#aR");if(r)a.remind=r.checked;};
    document.querySelectorAll("[data-ap]").forEach(b=>b.onclick=()=>{keep();a.personId=b.dataset.ap;draw()});
    document.querySelectorAll("[data-ak]").forEach(b=>b.onclick=()=>{keep();a.kind=b.dataset.ak;draw()});
    $("#aC").onclick=closeModal;
    $("#aS").onclick=()=>{ keep(); a.title=a.title.trim(); if(!a.title) return toast(T("needTitle")); if(!a.date) return;
      D.appts=D.appts||[]; if(a0) Object.assign(a0,a); else D.appts.push(Object.assign({id:uid()},a)); save(); closeModal(); render(); };
    const x=$("#aX"); if(x) x.onclick=()=>{ D.appts=D.appts.filter(y=>y.id!==id); save(); closeModal(); render(); };
  };
  draw();
}
function apptIcs(a){
  const st=a.date.replace(/-/g,"")+"T"+(a.time||"09:00").replace(":","")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Dori vaqti//UZ","BEGIN:VEVENT","UID:dv-appt-"+a.id+"@dorivaqti","DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",
    "DTSTART:"+st,"DURATION:PT1H","SUMMARY:"+icsEsc("🩺 "+a.title),"LOCATION:"+icsEsc(a.place||""),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(a.title),"TRIGGER:-P1D","END:VALARM",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(a.title),"TRIGGER:-PT2H","END:VALARM","END:VEVENT","END:VCALENDAR"];
  const url=URL.createObjectURL(new Blob([L.join("\r\n")],{type:"text/calendar;charset=utf-8"}));
  const el=document.createElement("a"); el.href=url; el.download="qabul.ics"; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000); toast(T("calDone"),3500);
}
function bindTools(){
  const A=$("#app");
  A.querySelectorAll("[data-wk]").forEach(b=>b.onclick=()=>{R.wk=+b.dataset.wk;render()});
  A.querySelectorAll("[data-wpf],[data-hpf]").forEach(b=>b.onclick=()=>{R.pf=b.dataset.wpf||b.dataset.hpf;render()});
  A.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{R.vt=b.dataset.vt;render()});
  A.querySelectorAll("[data-vdel]").forEach(b=>b.onclick=()=>confirmBox(T("delQ"),()=>{D.vitals=D.vitals.filter(v=>v.id!==b.dataset.vdel);save();render()}));
  const va=$("#vAdd"); if(va) va.onclick=vitalSheet;
  const aa=$("#aAdd"); if(aa) aa.onclick=()=>apptSheet(null);
  A.querySelectorAll("[data-appt]").forEach(b=>b.onclick=()=>apptSheet(b.dataset.appt));
  A.querySelectorAll("[data-acal]").forEach(b=>b.onclick=e=>{e.stopPropagation();const a=D.appts.find(x=>x.id===b.dataset.acal);if(a)apptIcs(a)});
}
function rxView(name){
  const u=photoURL(name); if(!u) return;
  $("#modal").innerHTML=`<div class="modal" onclick="closeModal()"><div class="sheet" style="text-align:center"><img src="${u}" style="max-width:100%;max-height:75vh;border-radius:12px"><button class="btn ghost mt">${T("close")}</button></div></div>`;
}

window.handleBack=function(){
  if($("#modal").innerHTML){ closeModal(); return true; }
  if(!D.setupDone){ if(R.step>0){ R.step--; render(); return true; } return false; }
  if(R.scr==="med"){ go(R.back||"meds",{care:R.care}); return true; }
  if(R.scr==="disc"){ go("set",{care:R.care}); return true; }
  if(R.scr==="rep"&&R.doc){ R.doc=false; render(); return true; }
  if(R.scr!=="home"){ go("home",{care:R.care}); return true; }
  if(R.care&&uiMode()==="simple"){ unlockedUntil=0; R={scr:"home"}; render(); return true; }
  return false;
};
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ D=load(); if(D.setupDone) render(); } });
setInterval(()=>{ if(D.setupDone&&R.scr==="home"&&!$("#modal").innerHTML) render(); }, 60000);
render();
</script>
